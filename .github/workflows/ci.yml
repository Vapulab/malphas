name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The *_templ.go files are committed so the module builds without templ:
      # CI makes sure none was left behind after a .templ edit.
      - name: templ generate leaves no diff
        run: |
          go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate
          git diff --exit-code
      - run: go vet ./...
      - run: go test ./...

  # Browser behavior: the catalog served by e2e/, in a real Chrome.
  # The GitHub runner already ships google-chrome.
  e2e:
    runs-on: ubuntu-latest
    env:
      TAILWIND_VERSION: v3.4.17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      # Without app.css the tests skip instead of running.
      - name: Build CSS
        working-directory: e2e
        run: |
          curl -fsSL -o /usr/local/bin/tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x /usr/local/bin/tailwindcss
          tailwindcss -c tailwind.config.js -i input.css -o static/app.css --minify
      - run: go vet ./...
        working-directory: e2e
      - run: go test ./...
        working-directory: e2e
